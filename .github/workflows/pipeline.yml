
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # 1. REGISTER DATASET
  # =========================================================

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv


  # =========================================================
  # 2. DATA PREPARATION
  # =========================================================

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas scikit-learn

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/model_building/X_train.csv
            tourism_project/model_building/X_test.csv
            tourism_project/model_building/y_train.csv
            tourism_project/model_building/y_test.csv


  # =========================================================
  # 3. MODEL TRAINING
  # =========================================================

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas scikit-learn xgboost joblib mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      - name: Model Building
        run: |
          python tourism_project/model_building/train.py

      # -------------------------------------------------------
      # Commit and push the newly trained model
      # -------------------------------------------------------

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the newly trained model
          git add tourism_project/deployment/best_model.pkl

          # Commit the model
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"

          # Update local branch with the latest remote changes
          git pull --rebase origin main

          # Push the trained model
          git push origin main
